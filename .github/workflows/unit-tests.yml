name: unit-tests
on:
  workflow_dispatch:
  push:
    branches: ["master"]
  pull_request:
    branches: ["**"]

permissions: {}

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Src Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false

      - run: mkdir -p ~/go/pkg/mod ~/.cache/go-build
      - name: Restore cached tools and go
        id: cache-tools-and-go-restore
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: cache-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('mise.lock') }}-${{ hashFiles('**/go.sum') }}
          restore-keys: |
            cache-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('mise.lock') }}-

      - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
        with:
          experimental: true
      
      - name: Build
        env:
          GOPROXY: "https://proxy.golang.org"
        run: just build

      - name: Check
        env:
          GOPROXY: "https://proxy.golang.org"
        run: just check

      - name: Tests
        env:
          GOPROXY: "https://proxy.golang.org"
          CI: true
        run: just test

      - name: Always save tools and go cache
        id: cache-tools-and-go-save
        if: always() && steps.cache-tools-and-go-restore.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          key: ${{ steps.cache-tools-and-go-restore.outputs.cache-primary-key }}
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod

  test-qemu:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      matrix:
        arch: [arm64]

    steps:
      - name: Src Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false

      - run: mkdir -p ~/go/pkg/mod ~/.cache/go-build
      - name: Restore cached tools and go
        id: cache-tools-and-go-restore
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: ${{ runner.os }}-${{ runner.arch }}-cache-${{ hashFiles('**/go.sum') }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-cache-

      - uses: jdx/mise-action@1648a7812b9aeae629881980618f079932869151 # v4.0.1
        with:
          experimental: true

      - name: Install QEMU
        uses: docker/setup-qemu-action@ce360397dd3f832beb865e1373c09c0e9f86d70a # v4.0.0

      - name: Build
        env:
          GOPROXY: "https://proxy.golang.org"
          GOARCH: ${{ matrix.arch }}
        run: just build

      - name: Tests
        env:
          GOPROXY: "https://proxy.golang.org"
          GOARCH: ${{ matrix.arch }}
          CI: true
        run: just test

      - name: Always save tools and go cache
        id: cache-tools-and-go-save
        if: always() && steps.cache-tools-and-go-restore.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          key: ${{ steps.cache-tools-and-go-restore.outputs.cache-primary-key }}
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
